version: '3.8'

services:
  # 🛢️ 1. Production PostgreSQL DB Service Node
  postgres:
    image: postgres:16-alpine
    container_name: uganda_network_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-network_intelligence}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-network_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 🐍 2. Production Python Pipeline Compute Node (Runs under unprivileged appuser)
  pipeline:
    build:
      context: .
    container_name: uganda_network_pipeline_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PIPELINE_NAME: ${PIPELINE_NAME:-uganda_network_intelligence_prod}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CRITICAL_AVAILABILITY_PCT: ${CRITICAL_AVAILABILITY_PCT}
      CRITICAL_PACKET_LOSS_PCT: ${CRITICAL_PACKET_LOSS_PCT}
      CRITICAL_LATENCY_MS: ${CRITICAL_LATENCY_MS}
      WARNING_AVAILABILITY_PCT: ${WARNING_AVAILABILITY_PCT}
      WARNING_PACKET_LOSS_PCT: ${WARNING_PACKET_LOSS_PCT}
      WARNING_LATENCY_MS: ${WARNING_LATENCY_MS}
      PIPELINE_SLA_SECONDS: ${PIPELINE_SLA_SECONDS}
      MAX_DATA_FRESHNESS_DAYS: ${MAX_DATA_FRESHNESS_DAYS}
    command: python -m src.pipeline

volumes:
  postgres_prod_data:
