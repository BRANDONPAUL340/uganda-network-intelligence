version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: uganda_network_postgres_prod
    environment:
      POSTGRES_DB: network_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d network_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    image: ghcr.io/brandonpaul340/uganda-network-dashboard:1.0.1
    container_name: uganda_network_dashboard_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/network_intelligence
      PIPELINE_NAME: uganda_network_intelligence
      ENVIRONMENT: production
      DASHBOARD_TITLE: Uganda Network & Service Intelligence
      DASHBOARD_PORT: 8501
    ports:
      - "8502:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -m src.dashboard.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_prod_data: