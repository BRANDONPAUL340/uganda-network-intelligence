name: Network Intelligence Platform CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  contract-validation:
    name: ⚡ Stage 1: Fast Pure Python Contract Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code Core
        uses: actions/checkout@v4

      - name: Initialize Python Ingestion Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Pinned Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run In-Memory Contract Tests
        # Executes fast, pure python validators without spin-up delays [INDEX]
        run: pytest tests/test_event_validation.py -v

  database-integration:
    name: 🛢️ Stage 2: Database Integration Tests
    needs: contract-validation # Only triggers if Stage 1 contract checks clear successfully [INDEX]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: network_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d network_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository Code Core
        uses: actions/checkout@v4

      - name: Initialize Python Ingestion Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Pinned Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Schema Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/network_intelligence
        run: python -m src.migrations

      - name: Run Full Database Integration Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/network_intelligence
        # This will run all remaining tests, catching your lineage errors transparently [INDEX]
        run: pytest -v
