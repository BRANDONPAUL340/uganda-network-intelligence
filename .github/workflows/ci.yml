name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    # 🐳 Provision an isolated background service container mapping your database schema
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: network_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d network_intelligence"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Pull the codebase components from your remote repository
      - name: Checkout repository code assets
        uses: actions/checkout@v4

      # 2. Deploy your matching Python runtime engine layer
      - name: Initialize Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🛠️ 3. Install native PostgreSQL client tools into the Ubuntu host runner
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 4. Download and unpack your exact platform modules
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Inject sandboxed test database credentials into the execution environment
      - name: Inject Configuration Environment Variables
        run: |
          echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/network_intelligence" >> $GITHUB_ENV
          echo "PIPELINE_NAME=uganda_network_intel" >> $GITHUB_ENV
          echo "ENV=test" >> $GITHUB_ENV
          echo "PIPELINE_SLA_SECONDS=60" >> $GITHUB_ENV
          echo "MAX_DATA_FRESHNESS_DAYS=1" >> $GITHUB_ENV
          echo "CRITICAL_AVAILABILITY_PCT=95" >> $GITHUB_ENV
          echo "CRITICAL_PACKET_LOSS_PCT=5" >> $GITHUB_ENV
          echo "CRITICAL_LATENCY_MS=70" >> $GITHUB_ENV
          echo "WARNING_AVAILABILITY_PCT=98" >> $GITHUB_ENV
          echo "WARNING_PACKET_LOSS_PCT=2" >> $GITHUB_ENV
          echo "WARNING_LATENCY_MS=40" >> $GITHUB_ENV

      # 🏗️ 6. Build the entire database schema from your structured repository script
      - name: Initialize database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d network_intelligence \
            -f database/schema.sql

      # 7. Run compile assertions over your entire source package tree
      - name: Run Syntax Compilation Verifications
        run: |
          python -m compileall src

      # 8. Execute all automated unit and integration tests
      - name: Execute Automated Regression Test Suite
        run: |
          pytest -v
